name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment Files
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Release APK with Proguard / R8
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-output/MyTasks-$TAG.apk 2>/dev/null || cp app/build/outputs/apk/release/*.apk release-output/MyTasks-$TAG.apk
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: "My Tasks ${{ steps.prepare_artifacts.outputs.tag }}"
          files: release-output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
